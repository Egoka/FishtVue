name: ❓ Question
description: Ask a question about FishtVue.
title: '[Question]: '
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **Before You Start...**

        Make sure to:

        - Read the [documentation](#).
        - Search for discussions [here](https://github.com/Egoka/FishtVue/discussions).
        - Provide sufficient details for your question.

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Select the component related to your question. If your question is general, select 'General'."
      options:
        - General
        - Accordion
        - Alert
        - Aria
        - Badge
        - Button
        - Calendar
        - Dialog
        - FixWindow
        - Icons
        - Input
        - InputLayout
        - Label
        - Loading
        - Menu
        - Pagination
        - Select
        - Separator
        - Split
        - Switch
        - Table
        - TextEditor
        - Form
    validations:
      required: true

  - type: textarea
    id: question-details
    attributes:
      label: Question details
      description: Provide details about your question or issue. Include any relevant context or links.
      placeholder: Question details
    validations:
      required: true