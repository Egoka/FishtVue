name: Release

on:
  push:
    branches:
      - lib
      - library/next
      - library/beta
      - library/dev

jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "pnpm"
      - name: Allow whitelisted build scripts (pnpm 11)
        # pnpm-workspace.yaml is gitignored to keep Vercel docs/ deploy
        # working (Root Directory = docs). Generate it on CI so pnpm 11
        # doesn't fail with ERR_PNPM_IGNORED_BUILDS. Field name in
        # workspace.yaml is `allowBuilds` (not `onlyBuiltDependencies`,
        # which is the package.json field name).
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          allowBuilds:
            '@parcel/watcher': true
            esbuild: true
          EOF
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint library
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test library
        run: pnpm test
      - name: Build library
        run: pnpm lib:build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: npx semantic-release