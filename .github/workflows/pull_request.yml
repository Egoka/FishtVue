name: Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - lib
      - library/next
      - library/beta
      - library/dev
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "pnpm"
      - name: Allow whitelisted build scripts (pnpm 11)
        # pnpm-workspace.yaml is gitignored to keep Vercel docs/ deploy
        # working (Root Directory = docs). Generate it on CI so pnpm 11
        # doesn't fail with ERR_PNPM_IGNORED_BUILDS. Field name in
        # workspace.yaml is `allowBuilds` (not `onlyBuiltDependencies`,
        # which is the package.json field name).
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          allowBuilds:
            '@parcel/watcher': true
            esbuild: true
            vue-demi: true
          EOF
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint library
        # lint:check = `eslint .` без --fix. Локальный `pnpm lint` чинит автоматически,
        # но в CI это делало гейт нерабочим: автофиксимая ошибка молча правилась
        # в раннере и шаг завершался с 0.
        run: pnpm lint:check
      - name: Type check
        run: pnpm typecheck
      - name: Test library
        run: pnpm test
      - name: Build library
        run: pnpm lib:build
      - name: Build sandbox
        # Песочница — единственный потребитель в репозитории, который собирается против живой
        # lib/, и до 1.0.0 её не проверял никто: корневой tsconfig держит её в exclude, а
        # `sandbox:build` не запускался вовсе (фильтр не матчил ни одного проекта). Из-за этого
        # она незаметно отстала от API за восемь волн редизайна props.
        #
        # Свой install-root и свой лок-файл, поэтому корневой `pnpm install` её не ставит.
        # `sandbox:build` = `vue-tsc --noEmit` (со strictTemplates) + `vite build`: голый
        # vite build проходит и на полностью устаревшем API, типовая проверка — нет.
        run: |
          pnpm --dir sandbox install --frozen-lockfile
          pnpm sandbox:build