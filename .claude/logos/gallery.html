<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Gallery</title>

  <!-- Tailwind CDN with config matching dashboard EXACTLY -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'SF Mono', 'Menlo', 'monospace'],
          },
        },
      },
    }
  </script>

  <style>
    /* Custom scrollbar matching dashboard */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #991b1b; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
    * { scrollbar-color: #991b1b #030712; scrollbar-width: thin; }

    /* Background variants for logo preview */
    .checker-bg { background: repeating-conic-gradient(#e5e5e5 0% 25%, #ffffff 0% 50%) 50% / 20px 20px; }
    .white-bg { background: #ffffff; }
    .dark-bg { background: #030712; }
  </style>
</head>
<body class="bg-gray-950 text-gray-300 min-h-screen p-4 font-mono">

  <!-- Main Container - Full Width -->
  <div class="w-full">

    <!-- Terminal Card Header (matching TerminalCard.tsx EXACTLY) -->
    <div class="font-mono relative flex flex-col min-h-0">
      <!-- Terminal prompt line - ABOVE the bordered container -->
      <div class="flex items-center gap-2 mb-2 shrink-0">
        <!-- Terminal icon (SVG matching lucide Terminal) -->
        <svg class="w-4 h-4 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span class="text-gray-400">ls -la</span>
        <span class="text-red-300 font-mono">.claude/logos/</span>
      </div>

      <!-- Bordered container -->
      <div class="border border-red-800 rounded bg-gray-900/80 flex flex-col min-h-0">
        <!-- Header row inside container -->
        <div class="bg-gray-900 px-4 py-2 border-b border-red-800 flex items-center justify-between gap-2 rounded-t shrink-0">
          <div class="text-gray-400 text-sm">
            Project: <span id="project-name" class="text-red-400">Loading...</span>
          </div>
          <div class="flex items-center gap-2">
            <span id="run-count" class="text-gray-500 text-xs"></span>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-12">
          <div class="w-8 h-8 border-2 border-gray-600 border-t-red-500 rounded-full animate-spin mb-4"></div>
          <p class="text-gray-400">Loading gallery...</p>
        </div>

        <!-- Gallery Content (populated by JavaScript) -->
        <div id="gallery-container" class="hidden p-4 overflow-auto"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 text-center px-4">
          <svg class="w-16 h-16 text-gray-600 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
          <h2 class="text-xl font-semibold text-gray-300 mb-2">No Logos Yet</h2>
          <p class="text-gray-500 text-sm">Run the logo-designer agent to generate your first logos.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for enlarged view -->
  <div id="modal" class="hidden fixed inset-0 z-50" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="absolute inset-0 bg-black/90 cursor-pointer" onclick="closeModal()"></div>
    <div class="relative flex flex-col items-center gap-4 z-10 max-w-[90vw] max-h-[90vh] m-auto mt-[5vh]">
      <button onclick="closeModal()" aria-label="Close modal" class="absolute -top-10 right-0 text-gray-300 text-4xl cursor-pointer p-2 leading-none hover:text-red-400 transition-colors">&times;</button>
      <div id="modal-img-container" class="checker-bg max-w-[80vw] max-h-[70vh] rounded overflow-hidden flex items-center justify-center p-6 border border-red-800">
        <img id="modal-img" src="" alt="Full size logo" class="max-w-full max-h-full object-contain">
      </div>
      <div class="flex gap-2">
        <button class="modal-bg-btn active bg-red-800 border border-red-800 text-gray-300 px-3 py-1.5 text-xs rounded transition-colors" data-bg="checker">Checker</button>
        <button class="modal-bg-btn bg-transparent border border-red-800 text-gray-400 hover:bg-red-800 hover:text-gray-900 px-3 py-1.5 text-xs rounded transition-colors" data-bg="white">White</button>
        <button class="modal-bg-btn bg-transparent border border-red-800 text-gray-400 hover:bg-red-800 hover:text-gray-900 px-3 py-1.5 text-xs rounded transition-colors" data-bg="dark">Dark</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * Logo Gallery JavaScript - Matching Dashboard Patterns
     */

    // ========================================
    // Manifest Loading
    // ========================================
    async function loadManifest() {
      try {
        const response = await fetch('./manifest.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        console.warn('Could not load manifest.json:', error.message);
        return null;
      }
    }

    // ========================================
    // Gallery Rendering
    // ========================================
    function renderGallery(manifest) {
      if (!manifest || !manifest.runs || manifest.runs.length === 0) {
        showEmptyState();
        return;
      }

      const sortedRuns = [...manifest.runs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      const container = document.getElementById('gallery-container');
      container.innerHTML = '';

      // Update run count
      document.getElementById('run-count').textContent = `${sortedRuns.length} run${sortedRuns.length !== 1 ? 's' : ''}`;

      sortedRuns.forEach((run, runIndex) => {
        const runSection = createRunSection(run, sortedRuns.length - runIndex);
        container.appendChild(runSection);
      });

      container.classList.remove('hidden');
    }

    function createRunSection(run, runNumber) {
      const section = document.createElement('section');
      section.className = 'mb-8 last:mb-0';

      const formattedDate = new Date(run.timestamp).toLocaleString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      // Check if run has reference image
      const hasReference = run.referenceImage && run.referenceImage.localPath;
      const referenceBadge = hasReference
        ? `<span class="text-xs px-2 py-0.5 bg-purple-500/20 text-purple-400 border border-purple-500/30 rounded flex items-center gap-1">
             <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <rect x="3" y="3" width="18" height="18" rx="2"/>
               <circle cx="8.5" cy="8.5" r="1.5"/>
               <path d="m21 15-5-5L5 21"/>
             </svg>
             Reference Used
           </span>`
        : '';

      // Run header - matching dashboard row styling
      section.innerHTML = `
        <div class="flex items-center gap-3 mb-4 pb-2 border-b border-red-800/50">
          <span class="text-red-400 font-semibold">Run ${runNumber}</span>
          <span class="text-gray-500 text-xs">${formattedDate}</span>
          <span class="text-xs px-2 py-0.5 bg-gray-900 border border-red-800 rounded text-gray-400">${run.model || 'Multiple Models'}</span>
          ${referenceBadge}
        </div>
        ${hasReference ? createReferencePreview(run) : ''}
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="grid-${run.id}"></div>
      `;

      const grid = section.querySelector('.grid');

      if (run.logos && run.logos.length > 0) {
        run.logos.forEach((logo, logoIndex) => {
          const logoPath = logo.path || `./${run.id}/${logo.filename}`;
          const card = createLogoCard({ ...logo, path: logoPath }, logoIndex + 1, logo.usedReference);
          grid.appendChild(card);
        });
      }

      return section;
    }

    function createReferencePreview(run) {
      const refPath = `./${run.id}/${run.referenceImage.localPath.replace('./', '')}`;
      return `
        <div class="mb-4 p-3 bg-purple-900/20 border border-purple-800/50 rounded-lg">
          <div class="flex items-center gap-3">
            <div class="checker-bg w-16 h-16 rounded overflow-hidden flex items-center justify-center cursor-pointer hover:opacity-80 transition-opacity" onclick="openModal('${refPath}')">
              <img src="${refPath}" alt="Reference image" class="max-w-full max-h-full object-contain">
            </div>
            <div>
              <span class="text-purple-400 text-sm font-semibold flex items-center gap-1.5">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <path d="m21 15-5-5L5 21"/>
                </svg>
                Reference Image
              </span>
              <p class="text-gray-500 text-xs mt-1">Used for style transfer and consistency</p>
              ${run.referenceImage.originalPath ? `<p class="text-gray-600 text-[10px] font-mono mt-0.5">${run.referenceImage.originalPath}</p>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function createLogoCard(logo, number, usedReference = false) {
      const card = document.createElement('div');
      // Card styling matching AccountCard: bg-gray-900/50 rounded-lg p-3 border-2 border-red-600
      card.className = 'bg-gray-900/50 rounded-lg p-3 border border-red-800 hover:border-red-600 transition-colors';

      const format = logo.format || (logo.path.toLowerCase().endsWith('.svg') ? 'SVG' : 'PNG');
      const escapeHtml = (str) => str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;') : '';
      const apiModel = logo.apiModel || logo.api_model || '';
      const prompt = logo.prompt || '';
      const hasRef = usedReference || logo.usedReference;

      // Format badge - SVG green, PNG blue (matching dashboard semantic colors)
      const formatBadgeClass = format.toLowerCase() === 'svg'
        ? 'bg-green-500/20 text-green-400 border border-green-500/30'
        : 'bg-blue-500/20 text-blue-400 border border-blue-500/30';

      // Reference badge for logos generated with style transfer
      const refBadge = hasRef
        ? `<span class="px-1.5 py-0.5 text-[10px] font-semibold uppercase rounded bg-purple-500/20 text-purple-400 border border-purple-500/30" title="Generated using reference image">REF</span>`
        : '';

      card.innerHTML = `
        <div class="logo-preview checker-bg w-full aspect-square flex items-center justify-center rounded overflow-hidden cursor-pointer hover:opacity-90 transition-opacity" onclick="openModal('${logo.path}')">
          <img src="${logo.path}" alt="Logo ${number}" loading="lazy" class="max-w-[90%] max-h-[90%] object-contain">
        </div>
        <div class="flex justify-between items-center mt-3">
          <span class="text-sm font-semibold text-gray-300">#${number}</span>
          <span class="flex items-center gap-2">
            <span class="text-gray-500 text-xs">${logo.model || ''}</span>
            ${refBadge}
            <span class="px-1.5 py-0.5 text-[10px] font-semibold uppercase rounded ${formatBadgeClass}">${format}</span>
          </span>
        </div>
        ${apiModel ? `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-mono bg-red-900/30 text-red-400 border border-red-800/50 rounded mt-1">API: ${escapeHtml(apiModel)}</span>` : ''}
        ${logo.description ? `<p class="text-gray-500 text-xs mt-1 line-clamp-2">${escapeHtml(logo.description)}</p>` : ''}
        <div class="flex gap-1 mt-2">
          <button class="bg-btn flex-1 bg-transparent border border-red-800 text-gray-400 hover:bg-red-800 hover:text-gray-900 px-2 py-1 text-xs rounded transition-colors active" data-bg="checker">Checker</button>
          <button class="bg-btn flex-1 bg-transparent border border-red-800 text-gray-400 hover:bg-red-800 hover:text-gray-900 px-2 py-1 text-xs rounded transition-colors" data-bg="white">White</button>
          <button class="bg-btn flex-1 bg-transparent border border-red-800 text-gray-400 hover:bg-red-800 hover:text-gray-900 px-2 py-1 text-xs rounded transition-colors" data-bg="dark">Dark</button>
        </div>
        ${prompt ? `
        <div class="mt-2">
          <button class="prompt-toggle flex items-center gap-1.5 w-full bg-transparent border border-red-800 text-gray-400 hover:bg-red-800 hover:text-gray-900 px-2 py-1.5 text-xs rounded transition-colors" onclick="togglePrompt(this)">
            <span class="prompt-toggle-icon transition-transform text-[10px]">▶</span>
            <span>Show Prompt</span>
          </button>
          <div class="prompt-content hidden p-3 border border-red-800 border-t-0 rounded-b bg-gray-900/90 max-h-48 overflow-y-auto">
            <span class="block text-[10px] text-red-400 uppercase tracking-wider mb-2 font-semibold">Generation Prompt</span>
            <div class="whitespace-pre-wrap text-xs text-gray-300 leading-relaxed">${escapeHtml(prompt)}</div>
          </div>
        </div>
        ` : ''}
      `;

      setupBackgroundToggle(card);
      return card;
    }

    function togglePrompt(btn) {
      const isActive = btn.classList.contains('active');
      btn.classList.toggle('active');
      const content = btn.nextElementSibling;
      content.classList.toggle('hidden');
      const icon = btn.querySelector('.prompt-toggle-icon');
      icon.style.transform = !isActive ? 'rotate(90deg)' : '';
      btn.querySelector('span:last-child').textContent = !isActive ? 'Hide Prompt' : 'Show Prompt';
      if (!isActive) {
        btn.classList.add('bg-red-800', 'text-gray-900', 'rounded-b-none');
      } else {
        btn.classList.remove('bg-red-800', 'text-gray-900', 'rounded-b-none');
      }
    }

    // ========================================
    // Background Toggle
    // ========================================
    function setupBackgroundToggle(card) {
      const preview = card.querySelector('.logo-preview');
      const buttons = card.querySelectorAll('.bg-btn');

      buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          buttons.forEach(b => {
            b.classList.remove('bg-red-800', 'text-gray-900');
            b.classList.add('bg-transparent', 'text-gray-400');
          });
          btn.classList.remove('bg-transparent', 'text-gray-400');
          btn.classList.add('bg-red-800', 'text-gray-900');

          const bg = btn.dataset.bg;
          preview.classList.remove('checker-bg', 'white-bg', 'dark-bg');
          preview.classList.add(`${bg}-bg`);
        });
      });

      // Set initial active state
      const firstBtn = buttons[0];
      firstBtn.classList.remove('bg-transparent', 'text-gray-400');
      firstBtn.classList.add('bg-red-800', 'text-gray-900');
    }

    // ========================================
    // Modal Functions
    // ========================================
    function openModal(imgSrc) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      const modalImgContainer = document.getElementById('modal-img-container');

      modalImg.src = imgSrc;
      modalImgContainer.className = 'checker-bg max-w-[80vw] max-h-[70vh] rounded overflow-hidden flex items-center justify-center p-6 border border-red-800';

      document.querySelectorAll('.modal-bg-btn').forEach((btn, i) => {
        if (i === 0) {
          btn.classList.remove('bg-transparent', 'text-gray-400');
          btn.classList.add('bg-red-800', 'text-gray-300');
        } else {
          btn.classList.remove('bg-red-800', 'text-gray-300');
          btn.classList.add('bg-transparent', 'text-gray-400');
        }
      });

      modal.classList.remove('hidden');
      modal.classList.add('flex', 'items-center', 'justify-center');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex', 'items-center', 'justify-center');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    document.querySelectorAll('.modal-bg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const modalImgContainer = document.getElementById('modal-img-container');
        document.querySelectorAll('.modal-bg-btn').forEach(b => {
          b.classList.remove('bg-red-800', 'text-gray-300');
          b.classList.add('bg-transparent', 'text-gray-400');
        });
        btn.classList.remove('bg-transparent', 'text-gray-400');
        btn.classList.add('bg-red-800', 'text-gray-300');

        const bg = btn.dataset.bg;
        modalImgContainer.className = `${bg}-bg max-w-[80vw] max-h-[70vh] rounded overflow-hidden flex items-center justify-center p-6 border border-red-800`;
      });
    });

    // ========================================
    // Empty State
    // ========================================
    function showEmptyState(message = null) {
      const emptyState = document.getElementById('empty-state');
      const container = document.getElementById('gallery-container');
      const loading = document.getElementById('loading');

      loading.classList.add('hidden');
      container.classList.add('hidden');
      emptyState.classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    // ========================================
    // Initialization
    // ========================================
    document.addEventListener('DOMContentLoaded', async () => {
      const manifest = await loadManifest();

      if (!manifest) {
        showEmptyState();
        return;
      }

      if (!manifest.runs || manifest.runs.length === 0) {
        showEmptyState();
        return;
      }

      const projectNameEl = document.getElementById('project-name');
      projectNameEl.textContent = manifest.projectName || manifest.project_name || 'Untitled Project';

      hideLoading();
      renderGallery(manifest);
    });
  </script>
</body>
</html>
